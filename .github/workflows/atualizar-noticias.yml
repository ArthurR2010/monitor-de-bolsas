name: Atualizar notícias

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar os arquivos do repositório
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Executar testes
        run: python -m unittest discover -v
      
      - name: Coletar notícias
        run: python coletar_noticias.py

      - name: Gerar página de publicações
        run: python gerar_noticias.py

      - name: Salvar alterações quando houver novidades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json NOTICIAS.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos dados."
          else
            git commit -m "Atualiza publicações do Estudar Fora"
            git push
          fi
